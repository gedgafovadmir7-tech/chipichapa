<title>Banner mobile</title>
<style>
  html, body { margin: 0; padding: 0; }
  body { background: #0A2242; }
  a.banner { position: relative; display: block; box-sizing: border-box; width: 100%; max-width: 1440px; height: 315px; overflow: hidden; background: #0A2242; }
  /* картинка прибита к левому краю: при сужении экрана баннер обрезается справа */
  .art { position: absolute; left: 0; top: 0; width: 1440px; height: 315px; max-width: none; }
  /* текст — SVG с кривыми (требование площадки) */
  .txt { position: absolute; left: 6.5%; top: 28px; width: 520px; height: 232px; }
  @keyframes up { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
  @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
  .art { animation: fade .8s ease-out both; }
  .txt { animation: up .7s ease-out .15s both; transition: transform .2s; }
  a.banner:hover .txt { transform: translateX(3px); }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
