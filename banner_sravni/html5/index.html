<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body { font-family: Inter, "Segoe UI", Roboto, Arial, sans-serif; background: #0B2647; }
  a.banner { position: relative; display: block; width: 100%; max-width: 1440px; height: 315px;
             overflow: hidden; text-decoration: none; color: #fff; background: #0A2242; }
  /* картинка прибита к левому краю: при сужении экрана обрезается справа */
  .art { position: absolute; left: 0; top: 0; width: 1440px; height: 315px; }
  .txt { position: absolute; left: 6.5%; top: 44px; width: 470px; z-index: 2; }
  .logo { display: flex; align-items: center; gap: 8px; margin-bottom: 14px;
           font-size: 13px; font-weight: 600; color: #C9D6E8; }
  .logo span.l { width: 26px; height: 26px; border-radius: 6px; background: #fff;
                  display: grid; place-items: center; }
  h1 { margin: 0 0 12px; font-size: 32px; line-height: 1.12; font-weight: 800; letter-spacing: -0.4px; }
  h1 em { font-style: normal; color: #FFC52E; }
  p  { margin: 0 0 20px; font-size: 15px; line-height: 1.45; color: #D7E1EE; max-width: 440px; }
  .btn { display: inline-flex; align-items: center; gap: 8px; background: #FFC52E; color: #14243D;
          font-weight: 700; font-size: 15px; padding: 12px 22px; border-radius: 999px;
          box-shadow: 0 6px 18px rgba(255,197,46,.25); transition: transform .2s, background .2s; }
  a.banner:hover .btn { background: #FFD35C; transform: translateY(-1px); }
  .btn i { font-style: normal; transition: transform .2s; }
  a.banner:hover .btn i { transform: translateX(4px); }
  .disc { position: absolute; left: 6.5%; bottom: 10px; z-index: 2; font-size: 10px; color: #7F93AF; }

  /* анимация появления */
  @keyframes up { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
  @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
  @keyframes pulse { 0%,100% { box-shadow: 0 6px 18px rgba(255,197,46,.25); } 50% { box-shadow: 0 6px 26px rgba(255,197,46,.55); } }
  @keyframes steam { 0% { opacity: 0; transform: translateY(6px); } 40% { opacity: 1; } 100% { opacity: 0; transform: translateY(-10px); } }
  .logo, h1, p, .btn { opacity: 0; animation: up .6s ease-out forwards; }
  .logo { animation-delay: .05s; } h1 { animation-delay: .15s; } p { animation-delay: .35s; }
  .btn { animation: up .6s ease-out .55s forwards, pulse 2.4s ease-in-out 1.6s infinite; }
  .ben { opacity: 0; animation: fade .5s ease-out forwards; }
  .b1 { animation-delay: .7s; } .b2 { animation-delay: .85s; } .b3 { animation-delay: 1s; } .b4 { animation-delay: 1.15s; }
  .scene { opacity: 0; animation: fade .9s ease-out .3s forwards; }
  .steam { animation: steam 3s ease-in-out 1.2s infinite; }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; opacity: 1 !important; } }

  /* мобильная версия */
  .mob { display: none; }
  @media (max-width: 767px) {
    body { background: #fff; }
    a.banner { height: auto; background: none; color: #14243D; padding: 12px; }
    .art, .txt, .disc { display: none; }
    .mob { display: block; position: relative; height: 101px; border-radius: 14px; background: #E9EEF5;
            overflow: hidden; padding: 12px 130px 0 14px; }
    .mob .l { width: 20px; height: 20px; border-radius: 50%; background: #fff; display: grid; place-items: center; margin-bottom: 8px; }
    .mob .l svg { width: 14px; height: 14px; }
    .mob b { display: block; font-size: 13px; }
    .mob span.s { display: block; font-size: 11px; color: #3D4A5C; margin-top: 2px; }
    .mob .mart { position: absolute; right: 0; top: 0; }
    .mob small { position: absolute; left: 14px; bottom: 8px; font-size: 7px; color: #8B95A3; }
  }
</style>
